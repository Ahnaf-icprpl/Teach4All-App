name: Checks

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  check:
    name: Run npm check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code check
        run: npm run check

      - name: Verify build
        run: npm run build
