services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - ENV=${ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-teach4all}:${POSTGRES_PASSWORD:-teach4all}@db:5432/${POSTGRES_DB:-teach4all}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-teach4all}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-teach4all}
      - POSTGRES_DB=${POSTGRES_DB:-teach4all}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teach4all} -d ${POSTGRES_DB:-teach4all}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
