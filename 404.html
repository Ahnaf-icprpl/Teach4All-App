<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2EEE1" />
    <meta name="description" content="Halaman yang Anda cari tidak ditemukan. Kembali ke ruang belajar Teach4All." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>404 — Halaman Tidak Ditemukan | Teach4All</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('teach4all.theme.v1');
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? '#1A232E' : '#F2EEE1';
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1D1C1D;
        background-color: #F2EEE1;
        --bg: #F2EEE1;
        --surface: #FDFCF8;
        --text: #1D1C1D;
        --muted: #707372;
        --accent: #9F513A;
        --accent-hover: #86422F;
        --deep-navy: #222E3C;
        --line: #E8E0CE;
        --shadow: 0 4px 20px rgba(34, 46, 60, 0.06), 0 2px 6px rgba(34, 46, 60, 0.03);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color: #FDFCF8;
        background-color: #1A232E;
        --bg: #1A232E;
        --surface: #222E3C;
        --text: #FDFCF8;
        --muted: #CFC7BC;
        --accent: #B77F63;
        --accent-hover: #D0987D;
        --deep-navy: #151D26;
        --line: #2D3945;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        max-width: 520px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 44px 36px;
        box-shadow: var(--shadow);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .illustration {
        width: 140px;
        height: 140px;
        margin-bottom: 24px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: rgba(159, 81, 58, 0.12);
        color: var(--accent);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      :root[data-theme="dark"] .badge {
        background: rgba(183, 127, 99, 0.2);
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 12px;
        color: var(--text);
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        width: 100%;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s, transform 0.1s;
        cursor: pointer;
        border: none;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: var(--accent);
        color: #FDFCF8;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: rgba(232, 224, 206, 0.4);
      }
      :root[data-theme="dark"] .btn-secondary:hover {
        background: rgba(45, 57, 69, 0.5);
      }
      .footer-note {
        margin-top: 28px;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.8;
      }
      @media (max-width: 480px) {
        .container {
          padding: 32px 20px;
        }
        h1 {
          font-size: 22px;
        }
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="container" role="main">
      <svg class="illustration" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="70" cy="70" r="60" fill="#E8E0CE" fill-opacity="0.35"/>
        <path d="M40 92C40 92 52 75 70 75C88 75 100 92 100 92" stroke="#9F513A" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="58" r="5" fill="#222E3C"/>
        <circle cx="90" cy="58" r="5" fill="#222E3C"/>
        <path d="M62 42L70 30L78 42" stroke="#D4A12D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="70" cy="24" r="2.5" fill="#D4A12D"/>
        <path d="M28 48L32 52M112 48L108 52" stroke="#9F513A" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="badge">Galat 404</div>
      <h1>Halaman Tidak Ditemukan</h1>
      <p>
        Jalur atau halaman yang Anda tuju tampaknya tidak ada atau telah dipindahkan.
        Jangan khawatir, Anda dapat langsung kembali ke ruang percakapan utama Teach4All.
      </p>
      <div class="actions">
        <a href="./" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Kembali ke Beranda
        </a>
      </div>
      <div class="footer-note">
        Teach4All — Ruang untuk Rasa Ingin Tahu
      </div>
    </main>
  </body>
</html>
